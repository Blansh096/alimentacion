/* ---------------------------------------------------------------
   ESTADO Y PERSISTENCIA LOCAL
--------------------------------------------------------------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function defaultData(){
  return {
    ingredients: [], recipes: [], mealPlan: {}, shoppingChecked: {}, driveFileId: null, lastSync: null,
    profiles: [ {id:'p1', name:'Persona 1'}, {id:'p2', name:'Persona 2'} ],
    inventory: {} // ingredientId -> gramos en despensa
  };
}

function loadLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const merged = Object.assign(defaultData(), parsed);
    if(!merged.profiles || merged.profiles.length!==2) merged.profiles = defaultData().profiles;
    migrateMealPlan(merged);
    return merged;
  }catch(e){ return defaultData(); }
}

// Convierte planes antiguos de un solo usuario ({recipeId,servings}) al formato
// por perfil ({ p1:{recipeId,servings}, p2:{recipeId,servings} }).
function migrateMealPlan(d){
  const [p1, p2] = d.profiles;
  Object.keys(d.mealPlan||{}).forEach(day=>{
    const dayPlan = d.mealPlan[day];
    Object.keys(dayPlan).forEach(slot=>{
      const entry = dayPlan[slot];
      // v0 -> v1: formato de un solo usuario {recipeId,servings} a formato por perfil.
      if(entry && entry.recipeId && !entry[p1.id] && !entry[p2.id]){
        dayPlan[slot] = { [p1.id]: {recipeId:entry.recipeId, servings:entry.servings||1}, [p2.id]: {recipeId:entry.recipeId, servings:entry.servings||1} };
      }
      // v1 -> v2: {recipeId,servings} por perfil a {recipeId,status,amounts} con gramos por ingrediente.
      [p1,p2].forEach(prof=>{
        const a = dayPlan[slot] && dayPlan[slot][prof.id];
        if(a && a.recipeId && !a.amounts){
          const recipe = (d.recipes||[]).find(r=>r.id===a.recipeId);
          const amounts = {};
          if(recipe){
            (recipe.ingredients||[]).forEach(ri=>{
              const ing = (d.ingredients||[]).find(i=>i.id===ri.ingredientId);
              if(!ing) return;
              const totalGrams = ri.unit===ing.baseUnit ? ri.quantity : ((ing.measures||[]).find(m=>m.label===ri.unit)||{grams:1}).grams*ri.quantity;
              amounts[ri.ingredientId] = recipe.servings>0 ? (totalGrams/recipe.servings)*(a.servings||1) : totalGrams*(a.servings||1);
            });
          }
          dayPlan[slot][prof.id] = { recipeId:a.recipeId, status:'planificado', amounts, deducted:false };
        }
        // asegurar que exista el flag "deducted" aunque la asignación ya estuviera en formato v2
        const a2 = dayPlan[slot] && dayPlan[slot][prof.id];
        if(a2 && a2.deducted===undefined) a2.deducted = false;
      });
    });
  });
}

let data = loadLocal();
let currentTab = "ingredientes";

  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

/* ---------------------------------------------------------------
   CÁLCULO DE MACROS
--------------------------------------------------------------- */
function findIngredient(id){ return data.ingredients.find(i=>i.id===id); }

function normalizeName(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function levenshtein(a,b){
  const m = a.length, n = b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}

function nameSimilarity(a,b){
  const na = normalizeName(a), nb = normalizeName(b);
  if(!na || !nb) return 0;
  if(na===nb) return 1;
  const dist = levenshtein(na,nb);
  const maxLen = Math.max(na.length, nb.length) || 1;
  let score = 1 - dist/maxLen;
  if(na.includes(nb) || nb.includes(na)) score = Math.max(score, 0.78);
  return score;
}

// Devuelve los ingredientes existentes más parecidos a `name`, ordenados de mayor a menor similitud.
function findSimilarIngredients(name, limit){
  const scored = data.ingredients.map(ing=>({id:ing.id, score:nameSimilarity(ing.name,name)}));
  scored.sort((a,b)=>b.score-a.score);
  return scored.filter(s=>s.score>=0.4).slice(0, limit||5);
}

function gramsForEntry(ing, quantity, unit){
  if(!ing) return 0;
  if(unit === ing.baseUnit) return quantity;
  const m = (ing.measures||[]).find(m=>m.label===unit);
  if(m) return quantity * m.grams;
  return quantity;
}

function macrosForGrams(ing, grams){
  const f = grams/100;
  return {
    kcal: (ing.kcal100||0)*f,
    protein: (ing.protein100||0)*f,
    carbs: (ing.carbs100||0)*f,
    fat: (ing.fat100||0)*f,
    fiber: (ing.fiber100||0)*f
  };
}

function calcRecipeTotals(recipe){
  const total = {kcal:0,protein:0,carbs:0,fat:0,fiber:0};
  (recipe.ingredients||[]).forEach(entry=>{
    const ing = findIngredient(entry.ingredientId);
    if(!ing) return;
    const grams = gramsForEntry(ing, entry.quantity, entry.unit);
    const m = macrosForGrams(ing, grams);
    total.kcal += m.kcal; total.protein += m.protein; total.carbs += m.carbs; total.fat += m.fat; total.fiber += m.fiber;
  });
  return total;
}

function round1(n){ return Math.round(n*10)/10; }

/* ---------------------------------------------------------------
   ASISTENTE: CARGA MASIVA DE UNA RECETA (DESDE VIDEO + IA)
--------------------------------------------------------------- */

// Analiza el JSON pegado por el usuario y arma el estado del asistente,
// buscando coincidencias por nombre contra los ingredientes existentes.
function analyzeRecipeImport(rawText){
  let json;
  try{
    const cleaned = rawText.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    json = JSON.parse(cleaned);
  }catch(e){
    return { error: 'El texto pegado no es un JSON válido.' };
  }
  if(!json || !Array.isArray(json.ingredients) || json.ingredients.length===0){
    return { error: 'El JSON no tiene un array "ingredients" con al menos un ingrediente.' };
  }

  const items = json.ingredients.map(ai=>{
    const matches = findSimilarIngredients(ai.name, 5);
    const exact = matches.find(m=>m.score>=0.99);
    let selection = 'new';
    let useAiData = true;
    if(exact){
      selection = exact.id;
      const ing = findIngredient(exact.id);
      useAiData = false; // por defecto conservamos lo que ya existe
      if(ing && ing.verified) useAiData = false;
    }
    return {
      ai: {
        name: String(ai.name||'').trim(),
        grams: parseFloat(ai.grams)||0,
        baseUnit: ai.baseUnit==='ml' ? 'ml' : 'g',
        kcal100: parseFloat(ai.kcal100)||0,
        protein100: parseFloat(ai.protein100)||0,
        carbs100: parseFloat(ai.carbs100)||0,
        fat100: parseFloat(ai.fat100)||0,
        fiber100: parseFloat(ai.fiber100)||0
      },
      matches, selection, useAiData
    };
  });

  return {
    error: null,
    meta: {
      name: String(json.recipeName||'').trim(),
      category: String(json.category||'').trim(),
      servings: parseInt(json.servings)||1,
      steps: Array.isArray(json.steps) ? json.steps.filter(s=>String(s).trim()) : []
    },
    aiTotal: json.totalMacros ? {
      kcal: parseFloat(json.totalMacros.kcal)||0, protein: parseFloat(json.totalMacros.protein)||0,
      carbs: parseFloat(json.totalMacros.carbs)||0, fat: parseFloat(json.totalMacros.fat)||0
    } : null,
    items
  };
}

// Perfil nutricional "efectivo" que se usará para un ítem del asistente,
// según si se asignó a un ingrediente existente (y con qué fuente de datos) o se creará uno nuevo.
function effectiveProfileForItem(item){
  if(item.selection === 'new'){
    return { kcal100:item.ai.kcal100, protein100:item.ai.protein100, carbs100:item.ai.carbs100, fat100:item.ai.fat100, fiber100:item.ai.fiber100 };
  }
  const ing = findIngredient(item.selection);
  if(!ing) return { kcal100:item.ai.kcal100, protein100:item.ai.protein100, carbs100:item.ai.carbs100, fat100:item.ai.fat100, fiber100:item.ai.fiber100 };
  if(ing.verified || !item.useAiData){
    return { kcal100:ing.kcal100, protein100:ing.protein100, carbs100:ing.carbs100, fat100:ing.fat100, fiber100:ing.fiber100 };
  }
  return { kcal100:item.ai.kcal100, protein100:item.ai.protein100, carbs100:item.ai.carbs100, fat100:item.ai.fat100, fiber100:item.ai.fiber100 };
}

function previewImportTotals(pending){
  const total = {kcal:0,protein:0,carbs:0,fat:0};
  pending.items.forEach(item=>{
    const p = effectiveProfileForItem(item);
    const f = item.ai.grams/100;
    total.kcal += (p.kcal100||0)*f; total.protein += (p.protein100||0)*f;
    total.carbs += (p.carbs100||0)*f; total.fat += (p.fat100||0)*f;
  });
  return total;
}

// Aplica las decisiones del asistente: crea/actualiza ingredientes y guarda la receta final.
function confirmRecipeImport(){
  const pending = pendingRecipeImport;
  const recipeIngredients = [];

  pending.items.forEach(item=>{
    let ingredientId;
    if(item.selection === 'new'){
      const created = {
        id: uid(), name: item.ai.name, category: '', baseUnit: item.ai.baseUnit,
        kcal100: item.ai.kcal100, protein100: item.ai.protein100, carbs100: item.ai.carbs100,
        fat100: item.ai.fat100, fiber100: item.ai.fiber100, measures: [], verified: false
      };
      data.ingredients.push(created);
      ingredientId = created.id;
    } else {
      const ing = findIngredient(item.selection);
      ingredientId = ing.id;
      if(item.useAiData && !ing.verified){
        ing.kcal100 = item.ai.kcal100; ing.protein100 = item.ai.protein100;
        ing.carbs100 = item.ai.carbs100; ing.fat100 = item.ai.fat100; ing.fiber100 = item.ai.fiber100;
      }
    }
    const ingFinal = findIngredient(ingredientId);
    recipeIngredients.push({ ingredientId, quantity: item.ai.grams, unit: ingFinal.baseUnit });
  });

  const recipe = {
    id: uid(), name: pending.meta.name || 'Receta sin nombre', category: pending.meta.category,
    servings: pending.meta.servings || 1, ingredients: recipeIngredients, steps: pending.meta.steps
  };
  data.recipes.push(recipe);
  pendingRecipeImport = null;
  saveLocal();
}

function parseMeasures(str){
  if(!str) return [];
  return str.split(',').map(s=>s.trim()).filter(Boolean).map(pair=>{
    const [label, grams] = pair.split('=').map(x=>x && x.trim());
    return { label: label||'unidad', grams: parseFloat(grams)||0 };
  }).filter(m=>m.label && m.grams>0);
}

// Valida y normaliza el JSON pegado por el usuario (proveniente de una IA)
// y agrega los ingredientes nuevos a la base; si el nombre ya existe, actualiza sus datos.
function importBulkIngredients(rawText){
  let arr;
  try{
    let cleaned = rawText.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    arr = JSON.parse(cleaned);
  }catch(e){
    return { added:0, updated:0, errors:['El texto pegado no es un JSON válido.'] };
  }
  if(!Array.isArray(arr)) arr = [arr];

  const byName = new Map(data.ingredients.map(i=>[i.name.trim().toLowerCase(), i]));
  let added = 0, updated = 0;
  const errors = [];

  arr.forEach((item,idx)=>{
    if(!item || typeof item !== 'object' || !item.name){
      errors.push(`Elemento ${idx+1}: falta "name", se omitió.`);
      return;
    }
    const nameKey = String(item.name).trim().toLowerCase();
    const measures = Array.isArray(item.measures)
      ? item.measures.filter(m=>m && m.label && m.grams>0).map(m=>({label:String(m.label), grams:parseFloat(m.grams)||0}))
      : [];
    const fields = {
      name: String(item.name).trim(),
      category: item.category ? String(item.category).trim() : '',
      baseUnit: (item.baseUnit==='ml') ? 'ml' : 'g',
      kcal100: parseFloat(item.kcal100)||0,
      protein100: parseFloat(item.protein100)||0,
      carbs100: parseFloat(item.carbs100)||0,
      fat100: parseFloat(item.fat100)||0,
      fiber100: parseFloat(item.fiber100)||0,
      measures
    };

    const existing = byName.get(nameKey);
    if(existing){
      if(existing.verified){
        // Los ingredientes verificados no se sobrescriben con datos de la IA.
        updated++;
      } else {
        Object.assign(existing, fields, {id: existing.id, verified: existing.verified});
        updated++;
      }
    } else {
      const created = Object.assign({id: uid(), verified:false}, fields);
      data.ingredients.push(created);
      byName.set(nameKey, created);
      added++;
    }
  });

  if(added>0 || updated>0) saveLocal();
  return { added, updated, errors };
}

--------------------------------------------------------------- */
function ensureSlot(day, slotKey){
  if(!data.mealPlan[day]) data.mealPlan[day] = {};
  if(!data.mealPlan[day][slotKey]) data.mealPlan[day][slotKey] = {};
  const [p1,p2] = data.profiles;
  if(!data.mealPlan[day][slotKey][p1.id]) data.mealPlan[day][slotKey][p1.id] = {recipeId:'', status:'', amounts:{}, deducted:false};
  if(!data.mealPlan[day][slotKey][p2.id]) data.mealPlan[day][slotKey][p2.id] = {recipeId:'', status:'', amounts:{}, deducted:false};
  return data.mealPlan[day][slotKey];
}

function recipeOptionsHtml(selectedId){
  return '<option value="">—</option>' + data.recipes.map(r=>`<option value="${r.id}" ${r.id===selectedId?'selected':''}>${escapeHtml(r.name)}</option>`).join('');
}

// Gramos "por defecto" de un ingrediente de receta para 1 porción base (sin ajustes personales).
function defaultGramsForRecipeIngredient(recipe, ri){
  const ing = findIngredient(ri.ingredientId);
  if(!ing) return 0;
  const totalGrams = gramsForEntry(ing, ri.quantity, ri.unit);
  return recipe.servings>0 ? totalGrams/recipe.servings : totalGrams;
}

// Al elegir una receta para una persona, se inicializan sus gramos personales con la porción base (1x).
function defaultAmountsForRecipe(recipe){
  const amounts = {};
  (recipe.ingredients||[]).forEach(ri=>{ amounts[ri.ingredientId] = round1(defaultGramsForRecipeIngredient(recipe, ri)); });
  return amounts;
}

// Macros reales de una asignación (persona+comida), usando los gramos personalizados si existen.
function calcAssignmentMacros(assignment){
  const total = {kcal:0,protein:0,carbs:0,fat:0,fiber:0};
  if(!assignment || !assignment.recipeId) return total;
  const recipe = data.recipes.find(r=>r.id===assignment.recipeId);
  if(!recipe) return total;
  (recipe.ingredients||[]).forEach(ri=>{
    const ing = findIngredient(ri.ingredientId);
    if(!ing) return;
    const defaultGrams = defaultGramsForRecipeIngredient(recipe, ri);
    const grams = (assignment.amounts && assignment.amounts[ri.ingredientId]!=null) ? assignment.amounts[ri.ingredientId] : defaultGrams;
    const m = macrosForGrams(ing, grams);
    total.kcal+=m.kcal; total.protein+=m.protein; total.carbs+=m.carbs; total.fat+=m.fat; total.fiber+=m.fiber;
  });
  return total;
}

const STATUS_LABELS = { planificado:'Planificado', comido:'Comido', fuera:'Fuera / delivery' };

// Descuenta (sign=-1) o repone (sign=+1) del inventario los ingredientes de una asignación ya cocinada.
function applyInventoryDelta(assignment, sign){
  if(!assignment || !assignment.recipeId) return;
  const recipe = data.recipes.find(r=>r.id===assignment.recipeId);
  if(!recipe) return;
  (recipe.ingredients||[]).forEach(ri=>{
    const defaultGrams = defaultGramsForRecipeIngredient(recipe, ri);
    const grams = (assignment.amounts && assignment.amounts[ri.ingredientId]!=null) ? assignment.amounts[ri.ingredientId] : defaultGrams;
    const current = data.inventory[ri.ingredientId] || 0;
    data.inventory[ri.ingredientId] = Math.max(0, round1(current + sign*grams));
  });
}

--------------------------------------------------------------- */
function computeAdherenceStats(){
  const todayKey = isoDate(new Date());
  const [p1,p2] = data.profiles;
  let comido=0, fuera=0, sinRegistrar=0;
  Object.keys(data.mealPlan||{}).forEach(day=>{
    if(day > todayKey) return; // solo días de hoy hacia atrás
    const plan = data.mealPlan[day];
    COMIDAS.forEach(([slotKey])=>{
      const slot = plan[slotKey]; if(!slot) return;
      [p1,p2].forEach(prof=>{
        const a = slot[prof.id];
        if(!a || !a.recipeId) return;
        if(a.status==='comido') comido++;
        else if(a.status==='fuera') fuera++;
        else sinRegistrar++;
      });
    });
  });
  const total = comido+fuera+sinRegistrar;
  return { comido, fuera, sinRegistrar, total, pct: total>0 ? Math.round((comido/total)*100) : null };
}

function viewCocina(){
  const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
  if(!kitchenDay || !days.some(d=>isoDate(d)===kitchenDay)){
    const todayInWeek = days.find(d=>isoDate(d)===isoDate(new Date()));
    kitchenDay = isoDate(todayInWeek || days[0]);
  }
  const [p1,p2] = data.profiles;
  const plan = data.mealPlan[kitchenDay] || {};

  const dayPicker = days.map((d,i)=>{
    const key = isoDate(d);
    return `<button type="button" class="chip ${key===kitchenDay?'chip-active':''}" data-kitchen-day="${key}">${DIAS[i].slice(0,3)} ${fmtShort(d)}</button>`;
  }).join('');

  const slotsHtml = COMIDAS.map(([slotKey,slotLabel])=>{
    const slot = plan[slotKey];
    const a1 = slot && slot[p1.id], a2 = slot && slot[p2.id];
    const active1 = a1 && a1.recipeId && a1.status!=='fuera';
    const active2 = a2 && a2.recipeId && a2.status!=='fuera';
    if(!active1 && !active2) return '';

    let body;
    if(active1 && active2 && a1.recipeId===a2.recipeId){
      const recipe = data.recipes.find(r=>r.id===a1.recipeId);
      const ingRows = (recipe.ingredients||[]).map(ri=>{
        const ing = findIngredient(ri.ingredientId); if(!ing) return '';
        const g1 = (a1.amounts && a1.amounts[ri.ingredientId]!=null) ? a1.amounts[ri.ingredientId] : defaultGramsForRecipeIngredient(recipe,ri);
        const g2 = (a2.amounts && a2.amounts[ri.ingredientId]!=null) ? a2.amounts[ri.ingredientId] : defaultGramsForRecipeIngredient(recipe,ri);
        return `<tr><td>${escapeHtml(ing.name)}</td><td><strong>${round1(g1+g2)} ${ing.baseUnit}</strong></td><td class="muted">${escapeHtml(p1.name)} ${round1(g1)} / ${escapeHtml(p2.name)} ${round1(g2)}</td></tr>`;
      }).join('');
      body = `<p class="muted">Misma receta para ambos: <strong>${escapeHtml(recipe.name)}</strong></p>
        <table><thead><tr><th>Ingrediente</th><th>Total a preparar</th><th>Reparto</th></tr></thead><tbody>${ingRows}</tbody></table>`;
    } else {
      body = [ [p1,a1,active1], [p2,a2,active2] ].filter(([,,act])=>act).map(([prof,a])=>{
        const recipe = data.recipes.find(r=>r.id===a.recipeId);
        const ingRows = (recipe.ingredients||[]).map(ri=>{
          const ing = findIngredient(ri.ingredientId); if(!ing) return '';
          const g = (a.amounts && a.amounts[ri.ingredientId]!=null) ? a.amounts[ri.ingredientId] : defaultGramsForRecipeIngredient(recipe,ri);
          return `<tr><td>${escapeHtml(ing.name)}</td><td>${round1(g)} ${ing.baseUnit}</td></tr>`;
        }).join('');
        return `<p class="muted" style="margin-top:8px;"><strong>${escapeHtml(prof.name)}:</strong> ${escapeHtml(recipe.name)}</p>
          <table><thead><tr><th>Ingrediente</th><th>Cantidad</th></tr></thead><tbody>${ingRows}</tbody></table>`;
      }).join('');
    }

    return `<div class="card"><div class="cardhead"><h3>${slotLabel}</h3></div>${body}</div>`;
  }).join('');

  const stats = computeAdherenceStats();

  return `
  <div class="toppanel"><div><h1>Cocina y cumplimiento</h1><p class="muted">Cantidades combinadas para cocinar una sola vez, y qué tanto se sigue el plan.</p></div></div>

  <div class="card">
    <div class="cardhead"><h3>Modo preparación</h3></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">${dayPicker}</div>
    ${slotsHtml || '<div class="empty">No hay comidas planificadas (ni marcadas como cocinadas) para este día.</div>'}
  </div>

  <div class="card">
    <div class="cardhead"><h3>Historial de cumplimiento</h3></div>
    ${stats.total===0 ? '<div class="empty">Todavía no hay comidas pasadas para evaluar.</div>' : `
    <p>De <strong>${stats.total}</strong> comidas planificadas hasta hoy (entre ambos), <strong>${stats.comido}</strong> se cocinaron según el plan (<strong>${stats.pct}%</strong>), <strong>${stats.fuera}</strong> terminaron siendo comida fuera / delivery, y <strong>${stats.sinRegistrar}</strong> quedaron sin marcar.</p>
    <p class="muted">Si el porcentaje de comida fuera es alto seguido, considera planificar menos días fijos a la semana y dejar más margen libre.</p>`}
  </div>`;
}

--------------------------------------------------------------- */
function viewCompras(){
  const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
  const weekKey = isoDate(weekStart);
  const aggregate = {}; // ingredientId -> grams

  const [p1,p2] = data.profiles;
  days.forEach(d=>{
    const key = isoDate(d);
    const plan = data.mealPlan[key];
    if(!plan) return;
    COMIDAS.forEach(([slotKey])=>{
      const slot = plan[slotKey];
      if(!slot) return;
      [p1,p2].forEach(prof=>{
        const assigned = slot[prof.id];
        if(!assigned || !assigned.recipeId || assigned.status==='fuera') return;
        const recipe = data.recipes.find(r=>r.id===assigned.recipeId);
        if(!recipe) return;
        (recipe.ingredients||[]).forEach(ri=>{
          const ing = findIngredient(ri.ingredientId);
          if(!ing) return;
          const grams = (assigned.amounts && assigned.amounts[ri.ingredientId]!=null) ? assigned.amounts[ri.ingredientId] : defaultGramsForRecipeIngredient(recipe, ri);
          aggregate[ing.id] = (aggregate[ing.id]||0) + grams;
        });
      });
    });
  });

  const items = Object.keys(aggregate).map(ingId=>{
    const ing = findIngredient(ingId);
    if(!ing) return null;
    const needed = aggregate[ingId];
    const stock = data.inventory[ingId] || 0;
    const toBuy = Math.max(0, needed - stock);
    const fmt = (g)=> g >= 1000 ? `${round1(g/1000)} kg` : `${Math.round(g)} ${ing.baseUnit}`;
    const checkKey = `${weekKey}_${ingId}`;
    const checked = !!data.shoppingChecked[checkKey];
    return {ing, needed, stock, toBuy, display:fmt(toBuy), neededDisplay:fmt(needed), stockDisplay:fmt(stock), checkKey, checked};
  }).filter(Boolean).sort((a,b)=>a.ing.name.localeCompare(b.ing.name));

  const toBuyItems = items.filter(it=>it.toBuy>0);
  const coveredItems = items.filter(it=>it.toBuy<=0);

  const listHtml = toBuyItems.map(it=>`
    <div class="shopitem ${it.checked?'checked':''}">
      <input type="checkbox" data-shop-check="${it.checkKey}" ${it.checked?'checked':''}>
      <span class="name" style="flex:1;">${escapeHtml(it.ing.name)}</span>
      <span class="muted">${it.display}${it.stock>0?` <span class="matchnote" style="display:inline;">(necesitas ${it.neededDisplay}, ya tienes ${it.stockDisplay})</span>`:''}</span>
    </div>`).join('');

  const coveredHtml = coveredItems.map(it=>`
    <div class="shopitem checked">
      <span class="verified-badge">✓</span>
      <span class="name" style="flex:1;">${escapeHtml(it.ing.name)}</span>
      <span class="muted">ya tienes suficiente (${it.stockDisplay} en despensa)</span>
    </div>`).join('');

  return `
  <div class="toppanel"><div><h1>Lista de compras</h1><p class="muted">Generada desde el plan de la semana del ${fmtShort(weekStart)} al ${fmtShort(addDays(weekStart,6))}, restando lo que ya tienes en la despensa.</p></div></div>
  <div class="card">
    ${toBuyItems.length===0 ? '<div class="empty">No falta comprar nada esta semana (o no hay recetas planificadas).</div>' : listHtml}
  </div>
  ${coveredItems.length>0 ? `<div class="card"><div class="cardhead"><h3>Ya tienes en despensa (no hace falta comprar)</h3></div>${coveredHtml}</div>` : ''}`;
}

async function driveFindFileId(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILENAME}' and trashed=false&spaces=drive&fields=files(id,name)`,{
    headers:{ Authorization: `Bearer ${accessToken}` }
  });
  const json = await res.json();
  if(json.files && json.files.length>0) return json.files[0].id;
  return null;
}

async function driveSave(){
  syncStatus = "Guardando..."; renderAll();
  try{
    if(!data.driveFileId){ data.driveFileId = await driveFindFileId(); }
    const payload = JSON.stringify({
      ingredients:data.ingredients, recipes:data.recipes, mealPlan:data.mealPlan,
      shoppingChecked:data.shoppingChecked, profiles:data.profiles, inventory:data.inventory
    });
    const boundary = "-------nutricion" + uid();
    const metadata = { name: DRIVE_FILENAME, mimeType: "application/json" };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;

    const url = data.driveFileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${data.driveFileId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const method = data.driveFileId ? 'PATCH' : 'POST';

    const res = await fetch(url,{
      method,
      headers:{ Authorization:`Bearer ${accessToken}`, 'Content-Type':`multipart/related; boundary=${boundary}` },
      body
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    data.driveFileId = json.id;
    data.lastSync = new Date().toISOString();
    saveLocal();
    syncStatus = "Guardado correctamente en Drive";
  }catch(e){
    syncStatus = "Error al guardar: " + e.message;
  }
  renderAll();
}

async function driveLoad(){
  syncStatus = "Cargando..."; renderAll();
  try{
    if(!data.driveFileId){ data.driveFileId = await driveFindFileId(); }
    if(!data.driveFileId){ syncStatus = "No se encontró ningún archivo en Drive todavía."; renderAll(); return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${data.driveFileId}?alt=media`,{
      headers:{ Authorization:`Bearer ${accessToken}` }
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    data.ingredients = json.ingredients || [];
    data.recipes = json.recipes || [];
    data.mealPlan = json.mealPlan || {};
    data.shoppingChecked = json.shoppingChecked || {};
    if(json.profiles && json.profiles.length===2) data.profiles = json.profiles;
    data.inventory = json.inventory || {};
    migrateMealPlan(data);
    saveLocal();
    syncStatus = "Datos cargados desde Drive";
  }catch(e){
    syncStatus = "Error al cargar: " + e.message;
  }
  renderAll();
}

/* ---------------------------------------------------------------
   HELPERS
--------------------------------------------------------------- */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------------------------------------------------------
   MANEJADORES DE EVENTOS (delegados tras cada render)
--------------------------------------------------------------- */
function attachHandlers(){
  // -------- Despensa --------
  document.querySelectorAll('[data-inv-set]').forEach(inp=>{
    inp.onchange = ()=>{
      data.inventory[inp.dataset.invSet] = parseFloat(inp.value)||0;
      saveLocal(); renderAll();
    };
  });
  const invAddIngredient = document.getElementById('inv-add-ingredient');
  if(invAddIngredient) invAddIngredient.onchange = ()=>{
    const ing = findIngredient(invAddIngredient.value);
    const unitSel = document.getElementById('inv-add-unit');
    if(!ing){ unitSel.innerHTML = '<option value="">—</option>'; return; }
    const opts = [ing.baseUnit, ...(ing.measures||[]).map(m=>m.label)];
    unitSel.innerHTML = opts.map(u=>`<option value="${u}">${u}</option>`).join('');
  };
  const invAddBtn = document.getElementById('inv-add-btn');
  if(invAddBtn) invAddBtn.onclick = ()=>{
    const ingId = document.getElementById('inv-add-ingredient').value;
    const qty = parseFloat(document.getElementById('inv-add-qty').value)||0;
    const unit = document.getElementById('inv-add-unit').value;
    const ing = findIngredient(ingId);
    if(!ing || qty<=0){ alert('Selecciona un ingrediente y una cantidad mayor a 0.'); return; }
    const grams = gramsForEntry(ing, qty, unit || ing.baseUnit);
    data.inventory[ingId] = round1((data.inventory[ingId]||0) + grams);
    saveLocal(); renderAll();
  };

  // -------- Ingredientes --------
  const fIng = document.getElementById('form-ingrediente');
  if(fIng){
    if(data.editingIngredientId){
      const ing = findIngredient(data.editingIngredientId);
      if(ing){
        fIng.name.value = ing.name; fIng.category.value = ing.category||'';
        fIng.baseUnit.value = ing.baseUnit; fIng.kcal100.value = ing.kcal100;
        fIng.protein100.value = ing.protein100; fIng.carbs100.value = ing.carbs100;
        fIng.fat100.value = ing.fat100; fIng.fiber100.value = ing.fiber100||0;
        fIng.measures.value = (ing.measures||[]).map(m=>`${m.label}=${m.grams}`).join(', ');
        fIng.verified.checked = !!ing.verified;
      }
    }
    fIng.onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(fIng);
      const obj = {
        id: data.editingIngredientId || uid(),
        name: fd.get('name').trim(),
        category: fd.get('category').trim(),
        baseUnit: fd.get('baseUnit'),
        kcal100: parseFloat(fd.get('kcal100'))||0,
        protein100: parseFloat(fd.get('protein100'))||0,
        carbs100: parseFloat(fd.get('carbs100'))||0,
        fat100: parseFloat(fd.get('fat100'))||0,
        fiber100: parseFloat(fd.get('fiber100'))||0,
        measures: parseMeasures(fd.get('measures')),
        verified: fIng.verified.checked
      };
      if(data.editingIngredientId){
        const idx = data.ingredients.findIndex(i=>i.id===obj.id);
        data.ingredients[idx] = obj;
        data.editingIngredientId = null;
      } else {
        data.ingredients.push(obj);
      }
      saveLocal(); renderAll();
    };
  }
  const cancelIng = document.getElementById('cancel-edit-ing');
  if(cancelIng) cancelIng.onclick = ()=>{ data.editingIngredientId = null; renderAll(); };

  const copyPrompt = document.getElementById('copy-bulk-prompt');
  if(copyPrompt) copyPrompt.onclick = ()=>{
    const ta = document.getElementById('bulk-prompt');
    ta.select();
    navigator.clipboard && navigator.clipboard.writeText(ta.value).then(()=>{
      copyPrompt.textContent = 'Copiado ✓';
      setTimeout(()=>{ copyPrompt.textContent = 'Copiar prompt'; },1800);
    }).catch(()=>{ document.execCommand('copy'); });
  };
  const importBulk = document.getElementById('import-bulk-json');
  if(importBulk) importBulk.onclick = ()=>{
    const ta = document.getElementById('bulk-json');
    if(!ta.value.trim()){ bulkImportMsg = 'Pega primero el JSON devuelto por la IA.'; renderAll(); return; }
    const res = importBulkIngredients(ta.value);
    let msg = `${res.added} ingrediente(s) nuevo(s) añadido(s).`;
    if(res.updated>0) msg += ` ${res.updated} actualizado(s) por nombre repetido.`;
    if(res.errors.length>0) msg += ` ${res.errors.length} con error: ${res.errors.join(' ')}`;
    bulkImportMsg = msg;
    renderAll();
  };

  document.querySelectorAll('[data-edit-ing]').forEach(b=>{
    b.onclick = ()=>{
      data.editingIngredientId = b.dataset.editIng; renderAll();
      const f = document.getElementById('form-ingrediente');
      if(f) f.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  document.querySelectorAll('[data-del-ing]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('¿Borrar este ingrediente?')) return;
      data.ingredients = data.ingredients.filter(i=>i.id!==b.dataset.delIng);
      saveLocal(); renderAll();
    };
  });

  // -------- Asistente de carga masiva de receta (video + IA) --------
  const copyRecipePrompt = document.getElementById('copy-recipe-prompt');
  if(copyRecipePrompt) copyRecipePrompt.onclick = ()=>{
    const ta = document.getElementById('recipe-import-prompt');
    ta.select();
    navigator.clipboard && navigator.clipboard.writeText(ta.value).then(()=>{
      copyRecipePrompt.textContent = 'Copiado ✓';
      setTimeout(()=>{ copyRecipePrompt.textContent = 'Copiar prompt'; },1800);
    }).catch(()=>{ document.execCommand('copy'); });
  };
  const analyzeBtn = document.getElementById('analyze-recipe-json');
  if(analyzeBtn) analyzeBtn.onclick = ()=>{
    const ta = document.getElementById('recipe-import-json');
    const errBox = document.getElementById('recipe-import-error');
    if(!ta.value.trim()){ errBox.textContent = 'Pega primero el JSON devuelto por la IA.'; return; }
    const result = analyzeRecipeImport(ta.value);
    if(result.error){ errBox.textContent = result.error; return; }
    pendingRecipeImport = result;
    renderAll();
  };

  document.querySelectorAll('[data-import-select]').forEach(sel=>{
    sel.onchange = ()=>{
      const idx = parseInt(sel.dataset.importSelect);
      const item = pendingRecipeImport.items[idx];
      item.selection = sel.value;
      const ing = sel.value!=='new' ? findIngredient(sel.value) : null;
      item.useAiData = ing && ing.verified ? false : (sel.value==='new' ? true : false);
      renderAll();
    };
  });
  document.querySelectorAll('[data-import-source]').forEach(radio=>{
    radio.onchange = ()=>{
      const idx = parseInt(radio.dataset.importSource);
      pendingRecipeImport.items[idx].useAiData = radio.value==='ai';
      renderAll();
    };
  });
  const metaName = document.getElementById('import-meta-name');
  if(metaName) metaName.oninput = ()=>{ pendingRecipeImport.meta.name = metaName.value; };
  const metaCategory = document.getElementById('import-meta-category');
  if(metaCategory) metaCategory.oninput = ()=>{ pendingRecipeImport.meta.category = metaCategory.value; };
  const metaServings = document.getElementById('import-meta-servings');
  if(metaServings) metaServings.oninput = ()=>{ pendingRecipeImport.meta.servings = parseInt(metaServings.value)||1; renderAll(); };

  const confirmImport = document.getElementById('confirm-recipe-import');
  if(confirmImport) confirmImport.onclick = ()=>{
    if(!pendingRecipeImport.meta.name.trim()){ alert('Ponle un nombre a la receta antes de confirmar.'); return; }
    confirmRecipeImport();
    renderAll();
  };
  const cancelImport = document.getElementById('cancel-recipe-import');
  if(cancelImport) cancelImport.onclick = ()=>{ pendingRecipeImport = null; renderAll(); };

  // -------- Recetas --------
  const addDraftIng = document.getElementById('add-draft-ing');
  if(addDraftIng) addDraftIng.onclick = ()=>{
    data.recipeDraft.ingredients.push({ingredientId:'', quantity:0, unit:''});
    renderAll();
  };
  document.querySelectorAll('[data-draft-ing]').forEach(sel=>{
    sel.onchange = ()=>{
      const idx = parseInt(sel.dataset.draftIng);
      const ing = findIngredient(sel.value);
      data.recipeDraft.ingredients[idx].ingredientId = sel.value;
      data.recipeDraft.ingredients[idx].unit = ing ? ing.baseUnit : '';
      renderAll();
    };
  });
  document.querySelectorAll('[data-draft-qty]').forEach(inp=>{
    inp.oninput = ()=>{ data.recipeDraft.ingredients[parseInt(inp.dataset.draftQty)].quantity = parseFloat(inp.value)||0; renderAll(); };
  });
  document.querySelectorAll('[data-draft-unit]').forEach(sel=>{
    sel.onchange = ()=>{ data.recipeDraft.ingredients[parseInt(sel.dataset.draftUnit)].unit = sel.value; renderAll(); };
  });
  document.querySelectorAll('[data-draft-rm]').forEach(b=>{
    b.onclick = ()=>{ data.recipeDraft.ingredients.splice(parseInt(b.dataset.draftRm),1); renderAll(); };
  });
  const addStep = document.getElementById('add-draft-step');
  if(addStep) addStep.onclick = ()=>{ data.recipeDraft.steps.push(''); renderAll(); };
  document.querySelectorAll('[data-draft-step]').forEach(ta=>{
    ta.oninput = ()=>{ data.recipeDraft.steps[parseInt(ta.dataset.draftStep)] = ta.value; };
  });
  document.querySelectorAll('[data-draft-rmstep]').forEach(b=>{
    b.onclick = ()=>{ data.recipeDraft.steps.splice(parseInt(b.dataset.draftRmstep),1); renderAll(); };
  });
  const nameInp = document.getElementById('draft-name');
  if(nameInp) nameInp.oninput = ()=>{ data.recipeDraft.name = nameInp.value; };
  const catInp = document.getElementById('draft-category');
  if(catInp) catInp.oninput = ()=>{ data.recipeDraft.category = catInp.value; };
  const servInp = document.getElementById('draft-servings');
  if(servInp) servInp.oninput = ()=>{ data.recipeDraft.servings = parseInt(servInp.value)||1; renderAll(); };

  const fRec = document.getElementById('form-receta');
  if(fRec) fRec.onsubmit = (e)=>{
    e.preventDefault();
    const draft = data.recipeDraft;
    if(!draft.name.trim()){ alert('Ponle un nombre a la receta.'); return; }
    const obj = {
      id: data.editingRecipeId || uid(),
      name: draft.name.trim(), category: draft.category, servings: draft.servings||1,
      ingredients: draft.ingredients.filter(i=>i.ingredientId),
      steps: draft.steps.filter(s=>s.trim())
    };
    if(data.editingRecipeId){
      const idx = data.recipes.findIndex(r=>r.id===obj.id);
      data.recipes[idx] = obj; data.editingRecipeId = null;
    } else {
      data.recipes.push(obj);
    }
    data.recipeDraft = null;
    saveLocal(); renderAll();
  };
  const cancelRec = document.getElementById('cancel-recipe');
  if(cancelRec) cancelRec.onclick = ()=>{ data.editingRecipeId = null; data.recipeDraft = null; renderAll(); };
  document.querySelectorAll('[data-edit-recipe]').forEach(b=>{
    b.onclick = ()=>{
      data.editingRecipeId = b.dataset.editRecipe; data.recipeDraft = null; renderAll();
      const f = document.getElementById('form-receta');
      if(f) f.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  document.querySelectorAll('[data-del-recipe]').forEach(b=>{
    b.onclick = ()=>{
      if(!confirm('¿Borrar esta receta?')) return;
      data.recipes = data.recipes.filter(r=>r.id!==b.dataset.delRecipe);
      saveLocal(); renderAll();
    };
  });

  // -------- Planificador --------
  const wprev = document.getElementById('week-prev');
  if(wprev) wprev.onclick = ()=>{ weekStart = addDays(weekStart,-7); renderAll(); };
  const wnext = document.getElementById('week-next');
  if(wnext) wnext.onclick = ()=>{ weekStart = addDays(weekStart,7); renderAll(); };
  const p0name = document.getElementById('profile-name-0');
  if(p0name) p0name.oninput = ()=>{ data.profiles[0].name = p0name.value || 'Persona 1'; saveLocal(); };
  const p1name = document.getElementById('profile-name-1');
  if(p1name) p1name.oninput = ()=>{ data.profiles[1].name = p1name.value || 'Persona 2'; saveLocal(); };

  document.querySelectorAll('[data-plan-day]').forEach(sel=>{
    sel.onchange = ()=>{
      const day = sel.dataset.planDay, slot = sel.dataset.planSlot, profileId = sel.dataset.planProfile;
      const entry = ensureSlot(day, slot);
      const old = entry[profileId];
      if(old && old.deducted) applyInventoryDelta(old, 1); // si ya se había descontado, se repone antes de reasignar
      const recipe = data.recipes.find(r=>r.id===sel.value);
      entry[profileId] = { recipeId: sel.value, status: sel.value?'planificado':'', amounts: recipe ? defaultAmountsForRecipe(recipe) : {}, deducted:false };
      if(plannerSelection && plannerSelection.day===day && plannerSelection.slot===slot && plannerSelection.profileId===profileId && !sel.value) plannerSelection = null;
      saveLocal(); renderAll();
    };
  });
  document.querySelectorAll('[data-set-status]').forEach(b=>{
    b.onclick = ()=>{
      const [day, slot, profileId, status] = b.dataset.setStatus.split('|');
      const entry = ensureSlot(day, slot);
      const a = entry[profileId];
      if(status==='comido' && !a.deducted){
        applyInventoryDelta(a, -1);
        a.deducted = true;
      } else if(status!=='comido' && a.deducted){
        applyInventoryDelta(a, 1);
        a.deducted = false;
      }
      a.status = status;
      saveLocal(); renderAll();
    };
  });
  document.querySelectorAll('[data-open-detail]').forEach(b=>{
    b.onclick = ()=>{
      const [day, slot, profileId] = b.dataset.openDetail.split('|');
      const same = plannerSelection && plannerSelection.day===day && plannerSelection.slot===slot && plannerSelection.profileId===profileId;
      plannerSelection = same ? null : {day, slot, profileId};
      renderAll();
      if(!same){ const panel = document.getElementById('planner-detail-panel'); if(panel) panel.scrollIntoView({behavior:'smooth', block:'start'}); }
    };
  });
  const closeDetail = document.getElementById('close-detail');
  if(closeDetail) closeDetail.onclick = ()=>{ plannerSelection = null; renderAll(); };
  document.querySelectorAll('[data-amount-ing]').forEach(inp=>{
    inp.oninput = ()=>{
      const { day, slot, profileId } = plannerSelection;
      const entry = ensureSlot(day, slot);
      if(!entry[profileId].amounts) entry[profileId].amounts = {};
      entry[profileId].amounts[inp.dataset.amountIng] = parseFloat(inp.value)||0;
      saveLocal(); renderAll();
    };
  });
  const moveBtn = document.getElementById('move-meal-btn');
  if(moveBtn) moveBtn.onclick = ()=>{
    const targetDay = document.getElementById('move-target-day').value;
    const { day, slot, profileId } = plannerSelection;
    const sourceEntry = ensureSlot(day, slot);
    const targetEntry = ensureSlot(targetDay, slot);
    const moving = sourceEntry[profileId];
    if(targetEntry[profileId].recipeId && !confirm('Ya hay algo planificado ese día para esa persona. ¿Reemplazarlo?')) return;
    targetEntry[profileId] = moving;
    sourceEntry[profileId] = {recipeId:'', status:'', amounts:{}};
    plannerSelection = {day: targetDay, slot, profileId};
    saveLocal(); renderAll();
  };
  document.querySelectorAll('[data-plan-equalize]').forEach(b=>{
    b.onclick = ()=>{
      const [day, slot] = b.dataset.planEqualize.split('|');
      const [p1,p2] = data.profiles;
      const entry = ensureSlot(day, slot);
      entry[p2.id] = JSON.parse(JSON.stringify(entry[p1.id]));
      saveLocal(); renderAll();
    };
  });

  // -------- Cocina --------
  document.querySelectorAll('[data-kitchen-day]').forEach(b=>{
    b.onclick = ()=>{ kitchenDay = b.dataset.kitchenDay; renderAll(); };
  });

  // -------- Lista de compras --------
  document.querySelectorAll('[data-shop-check]').forEach(cb=>{
    cb.onchange = ()=>{
      data.shoppingChecked[cb.dataset.shopCheck] = cb.checked;
      saveLocal(); renderAll();
    };
  });

  // -------- Sincronización --------
  const dConnect = document.getElementById('drive-connect');
  if(dConnect) dConnect.onclick = ()=>{
    initTokenClientOnce();
    if(tokenClient) tokenClient.requestAccessToken({prompt: accessToken ? '' : 'consent'});
  };
  const dSave = document.getElementById('drive-save');
  if(dSave) dSave.onclick = driveSave;
  const dLoad = document.getElementById('drive-load');
  if(dLoad) dLoad.onclick = driveLoad;
  const exp = document.getElementById('export-json');
  if(exp) exp.onclick = ()=>{
    const blob = new Blob([JSON.stringify({ingredients:data.ingredients,recipes:data.recipes,mealPlan:data.mealPlan,shoppingChecked:data.shoppingChecked,profiles:data.profiles,inventory:data.inventory},null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'nutricion-datos.json'; a.click();
  };
  const imp = document.getElementById('import-json');
  if(imp) imp.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const json = JSON.parse(reader.result);
        data.ingredients = json.ingredients||[]; data.recipes = json.recipes||[];
        data.mealPlan = json.mealPlan||{}; data.shoppingChecked = json.shoppingChecked||{};
        if(json.profiles && json.profiles.length===2) data.profiles = json.profiles;
        data.inventory = json.inventory || {};
        migrateMealPlan(data);
        saveLocal(); renderAll();
      }catch(err){ alert('El archivo no es un JSON válido.'); }
    };
    reader.readAsText(file);
  };
}

/* ---------------------------------------------------------------
   ARRANQUE
--------------------------------------------------------------- */
renderAll();
window.addEventListener('load', initTokenClientOnce);
</script>
